<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Yair Vergara — Desarrollador de software</title>
    <meta name="description" content="Portafolio de Yair Vergara Ávila, desarrollador full-stack web (PHP, Laravel, JavaScript, MySQL) en Bogotá, Colombia." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yair Vergara — Desarrollador de software" />
    <meta property="og:description" content="Proyectos reales con PHP, Laravel, JavaScript y MySQL, en una credencial de acceso interactiva." />
    <meta property="og:url" content="https://yairv1.github.io/portafolio_/" />
    <meta property="og:image" content="https://yairv1.github.io/portafolio_/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://yairv1.github.io/portafolio_/" />
    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:22px;background:#07060C;transition:opacity .55s cubic-bezier(.16,1,.3,1),visibility .55s}
      #boot.boot-out{opacity:0;visibility:hidden}
      .boot-card{position:relative;width:76px;height:106px;border-radius:12px;border:1px solid rgba(196,181,253,.35);background:linear-gradient(160deg,#191533,#100E1F);overflow:hidden;box-shadow:0 0 50px -14px rgba(139,92,246,.7)}
      .boot-card:before{content:'';position:absolute;left:12px;right:12px;top:14px;height:46px;border-radius:7px;background:rgba(139,92,246,.18)}
      .boot-card:after{content:'';position:absolute;left:12px;top:70px;width:34px;height:5px;border-radius:3px;background:rgba(196,181,253,.5);box-shadow:0 11px 0 -1px rgba(138,135,166,.35)}
      .boot-scan{position:absolute;left:0;right:0;height:2px;top:0;background:#22D3EE;box-shadow:0 0 14px 3px rgba(34,211,238,.6);animation:bootscan 1.2s cubic-bezier(.65,0,.35,1) infinite alternate}
      #boot p{margin:0;font:500 11px/1 ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;color:#8A87A6}
      @keyframes bootscan{to{top:calc(100% - 2px)}}
      @media (prefers-reduced-motion:reduce){.boot-scan{animation:none;top:50%}}
    </style>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,500&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="boot" role="status" aria-label="Cargando portafolio"><div class="boot-card"><span class="boot-scan"></span></div><p>Verificando credencial</p></div>
    <div id="root"></div>
    <noscript><p style="color:#F2F0FA;font-family:system-ui;padding:24px">Este portafolio necesita JavaScript. Puedes ver mis proyectos en <a style="color:#C4B5FD" href="https://github.com/yairV1">github.com/yairV1</a>.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
